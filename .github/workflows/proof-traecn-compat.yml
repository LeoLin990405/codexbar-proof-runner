# FORK-ONLY WORKFLOW — upgrade/data-model compatibility proof for upstream CodexBar PR #4780.
#
# Builds the actual CodexBar.app on a GitHub-hosted macos-26 runner (real Aqua/WindowServer
# session), then proves a v0.81.0-style stored settings file survives the change: a first launch
# writes the legacy `detailSection:Credits` hidden choice through the production config API; a second
# (restart) launch loads that persisted pre-upgrade config on the PR-head build, injects a Trae CN
# snapshot through the DEBUG store hook, opens the real Settings → Trae CN pane, and captures the
# picker showing the renamed `Credit breakdown` row still hidden with no unavailable placeholder.
#
# Never intended for upstream: this file lives only on proof/* branches of the scratch repo.
name: proof-traecn-compat

on:
  push:
    branches: ["proof/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  traecn-compat:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner and GUI fact sheet
        run: |
          set +e
          echo "=== git head ==="; git log --oneline -2; git status --short --branch | head -5
          echo "=== sw_vers ==="; sw_vers
          echo "=== xcodebuild ==="; xcodebuild -version
          echo "=== swift ==="; swift --version
          echo "=== console user ==="; stat -f%Su /dev/console
          echo "=== probe screencapture ==="; screencapture -x /tmp/desktop-probe.png && file /tmp/desktop-probe.png
          echo "=== disk ==="; df -h / | tail -1

      - name: Restore SwiftPM build cache
        uses: actions/cache@v4
        with:
          path: .build
          key: proof-swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-v1
          restore-keys: |
            proof-swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'Package.swift') }}-
            proof-swiftpm-${{ runner.os }}-

      - name: Build and package CodexBar.app (debug, ad-hoc signed)
        run: |
          set -eo pipefail
          echo "Starting build: $(date -u +%FT%TZ)"
          CODEXBAR_SIGNING=adhoc CODEXBAR_PROOF_SKIP_WIDGET_EXTENSION=1 \
            ./Scripts/package_app.sh debug 2>&1 | tee "$RUNNER_TEMP/build-package.log"
          echo "Finished build: $(date -u +%FT%TZ)"
          git rev-parse HEAD; git log --oneline -2
          echo "git commit: $(/usr/libexec/PlistBuddy -c 'Print :CodexGitCommit' CodexBar.app/Contents/Info.plist)"

      - name: Seed legacy settings, restart, and capture the Trae CN picker
        run: |
          set +e
          APP="$PWD/CodexBar.app"
          OUT="$PWD/proof-out"
          PROOF_DIR=/tmp/codexbar-proof
          CFG="$HOME/.config/codexbar/config.json"
          LEGACY="detailSection:Credits"
          mkdir -p "$OUT"
          failures=0
          git log --oneline -3 > "$OUT/git-head.txt"
          git rev-parse HEAD >> "$OUT/git-head.txt"

          cat > "$RUNNER_TEMP/dump-windows.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation
          let windows = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] ?? []
          for window in windows {
              let owner = window[kCGWindowOwnerName as String] as? String ?? "?"
              if !owner.lowercased().contains("codexbar") { continue }
              let number = window[kCGWindowNumber as String] as? Int ?? -1
              let layer = window[kCGWindowLayer as String] as? Int ?? -99
              let alpha = window[kCGWindowAlpha as String] as? Double ?? -1
              let onscreen = window[kCGWindowIsOnscreen as String] as? Bool ?? false
              let bounds = window[kCGWindowBounds as String] ?? "?"
              print("owner=\(owner) number=\(number) layer=\(layer) alpha=\(alpha) onscreen=\(onscreen) bounds=\(bounds)")
          }
          SWIFT

          window_number_from() {
            local marker="$1"
            local number
            number=$(plutil -extract windowNumber raw -o - "$marker" 2>/dev/null)
            if [ -z "$number" ]; then
              number=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("windowNumber",""))' "$marker" 2>/dev/null)
            fi
            printf '%s' "$number"
          }

          pkill -x CodexBar 2>/dev/null
          sleep 1
          rm -rf "$PROOF_DIR"
          mkdir -p "$PROOF_DIR"
          rm -f "$CFG"

          echo "=================== phase 1: seed legacy hidden id ==================="
          printf 'seed\n' > "$PROOF_DIR/mode"
          SEED_LOG="$OUT/app-seed.log"
          "$APP/Contents/MacOS/CodexBar" >"$SEED_LOG" 2>&1 &
          echo "$(date -u +%H:%M:%S) seed launch pid=$!"
          SEED_MARKER="$PROOF_DIR/marker-seed.json"
          for i in $(seq 1 600); do
            [ -f "$SEED_MARKER" ] && break
            sleep 0.5
          done
          if [ ! -f "$SEED_MARKER" ]; then
            echo "ERROR: no seed marker"; tail -80 "$SEED_LOG"; failures=$((failures + 1))
          else
            cp "$SEED_MARKER" "$OUT/"
            cat "$SEED_MARKER"
          fi
          # Wait for the production config persistence to reach disk with the legacy id.
          SEEDED=0
          for i in $(seq 1 120); do
            if grep -q "$LEGACY" "$CFG" 2>/dev/null; then SEEDED=1; break; fi
            sleep 0.5
          done
          echo "seeded=$SEEDED config=$CFG"
          cp "$CFG" "$OUT/config-after-seed.json" 2>/dev/null
          head -c 4000 "$CFG" 2>/dev/null
          pkill -x CodexBar 2>/dev/null
          sleep 2
          pkill -9 -x CodexBar 2>/dev/null
          sleep 1

          echo "=================== phase 2: restart on persisted pre-upgrade config ==================="
          echo "config before verify launch:"; grep -o 'detailSection[^"]*' "$CFG" 2>/dev/null
          cp "$CFG" "$OUT/config-before-verify.json" 2>/dev/null
          printf 'verify\n' > "$PROOF_DIR/mode"
          rm -f "$PROOF_DIR/marker.json" "$PROOF_DIR/runtime-evidence-"*
          VERIFY_LOG="$OUT/app-verify.log"
          "$APP/Contents/MacOS/CodexBar" >"$VERIFY_LOG" 2>&1 &
          echo "$(date -u +%H:%M:%S) verify launch pid=$!"
          VERIFY_MARKER="$PROOF_DIR/marker-verify.json"
          for i in $(seq 1 600); do
            [ -f "$VERIFY_MARKER" ] && break
            sleep 0.5
          done
          if [ ! -f "$VERIFY_MARKER" ]; then
            echo "ERROR: no verify marker"; tail -80 "$VERIFY_LOG"; failures=$((failures + 1))
            pkill -x CodexBar 2>/dev/null
            exit 1
          fi
          cp "$VERIFY_MARKER" "$OUT/"
          cp "$PROOF_DIR/runtime-evidence-verify.txt" "$OUT/" 2>/dev/null
          echo "=== verify marker ==="; cat "$VERIFY_MARKER"
          cp "$CFG" "$OUT/config-during-verify.json" 2>/dev/null
          WINDOW_NUMBER=$(window_number_from "$VERIFY_MARKER")
          echo "capturing verify window=$WINDOW_NUMBER"
          sleep 2.0
          screencapture -x "$OUT/compat-screen-step0.png"
          screencapture -x -l "$WINDOW_NUMBER" "$OUT/compat-window-step0.png" 2>/dev/null
          swift "$RUNNER_TEMP/dump-windows.swift" > "$OUT/windows-verify.txt" 2>&1
          cat "$OUT/windows-verify.txt"
          sleep 1.0
          screencapture -x "$OUT/compat-screen-step0-b.png"
          echo "=== verify harness runtime evidence (redacted) ==="
          grep "\[proof-harness\]" "$VERIFY_LOG" | sed 's/^\[proof-harness\] //' | head -60
          pkill -x CodexBar 2>/dev/null
          sleep 2
          pkill -9 -x CodexBar 2>/dev/null
          cp "$CFG" "$OUT/config-after-verify.json" 2>/dev/null
          echo "config after verify launch:"; grep -o 'detailSection[^"]*' "$CFG" 2>/dev/null

          ls -la "$OUT"
          [ -s "$OUT/marker-seed.json" ] || { echo "MISSING seed marker"; failures=$((failures + 1)); }
          [ -s "$OUT/marker-verify.json" ] || { echo "MISSING verify marker"; failures=$((failures + 1)); }
          [ -s "$OUT/compat-screen-step0.png" ] || { echo "MISSING verify screen"; failures=$((failures + 1)); }
          grep -q '"hasUnavailablePlaceholderRow" : false' "$OUT/marker-verify.json" || { echo "WARN: unavailable-placeholder flag missing/true"; }
          grep -q 'detailSection:Credit breakdown' "$OUT/marker-verify.json" || { echo "WARN: migrated id missing in verify marker"; }
          echo "failures=$failures"
          if [ "$failures" -ne 0 ]; then
            echo "PROOF CAPTURE INCOMPLETE"
            exit 1
          fi
          echo "PROOF CAPTURE OK"

      - name: Collect diagnostics
        if: always()
        run: |
          set +e
          mkdir -p proof-out
          cp "$RUNNER_TEMP/build-package.log" proof-out/ 2>/dev/null
          cp "$RUNNER_TEMP/dump-windows.swift" proof-out/ 2>/dev/null
          cp -R /tmp/codexbar-proof proof-out/proof-dir 2>/dev/null
          cp /tmp/desktop-probe.png proof-out/ 2>/dev/null
          true

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-proof-4780-compat
          path: proof-out
          if-no-files-found: warn
